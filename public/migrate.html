<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色卡迁移工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .status {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
        .status-item span:first-child {
            font-weight: bold;
            color: #333;
        }
        .status-item span:last-child {
            color: #667eea;
            font-weight: bold;
        }
        .button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .button-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .button-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .button-secondary:hover {
            background: #f0f4ff;
        }
        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            display: none;
        }
        .log.visible {
            display: block;
        }
        .log-line {
            margin-bottom: 5px;
        }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        .warning { color: #ffaa00; }
        .info { color: #00aaff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 角色卡迁移工具</h1>
        <p class="subtitle">将浏览器中的角色卡迁移到服务器，让所有用户都能访问</p>

        <div class="status">
            <div class="status-item">
                <span>📱 浏览器本地存储</span>
                <span id="localCount">加载中...</span>
            </div>
            <div class="status-item">
                <span>☁️ 服务器存储</span>
                <span id="serverCount">加载中...</span>
            </div>
        </div>

        <button class="button button-primary" id="checkBtn" onclick="checkStatus()">
            🔍 刷新状态
        </button>

        <button class="button button-primary" id="migrateBtn" onclick="startMigration()" disabled>
            ⬆️ 开始迁移到服务器
        </button>

        <button class="button button-secondary" onclick="toggleLog()">
            📋 显示/隐藏日志
        </button>

        <div class="log" id="log"></div>
    </div>

    <script>
        let localCharacters = [];
        let serverCharacters = [];

        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            line.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function toggleLog() {
            const logDiv = document.getElementById('log');
            logDiv.classList.toggle('visible');
        }

        // 读取浏览器 IndexedDB 数据
        async function getLocalCharacters() {
            return new Promise((resolve, reject) => {
                const dbRequest = indexedDB.open('CharacterAppDB', 10);

                dbRequest.onerror = () => {
                    addLog('❌ 无法打开 IndexedDB', 'error');
                    reject(dbRequest.error);
                };

                dbRequest.onsuccess = () => {
                    const db = dbRequest.result;
                    const transaction = db.transaction(['characters_record'], 'readonly');
                    const objectStore = transaction.objectStore('characters_record');
                    const getRequest = objectStore.get('data');

                    getRequest.onsuccess = () => {
                        const data = getRequest.result || [];
                        addLog(`✅ 从浏览器读取到 ${data.length} 个角色卡`, 'success');
                        resolve(data);
                    };

                    getRequest.onerror = () => {
                        addLog('❌ 读取浏览器数据失败', 'error');
                        reject(getRequest.error);
                    };
                };
            });
        }

        // 读取图片 Blob
        async function getImageBlob(imagePath) {
            return new Promise((resolve, reject) => {
                const dbRequest = indexedDB.open('CharacterAppDB', 10);

                dbRequest.onsuccess = () => {
                    const db = dbRequest.result;
                    const transaction = db.transaction(['character_images'], 'readonly');
                    const objectStore = transaction.objectStore('character_images');
                    const getRequest = objectStore.get(imagePath);

                    getRequest.onsuccess = () => {
                        resolve(getRequest.result || null);
                    };

                    getRequest.onerror = () => reject(getRequest.error);
                };
            });
        }

        // 转换 Blob 到 base64
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // 获取服务器角色卡
        async function getServerCharacters() {
            try {
                const response = await fetch('/api/characters');
                const result = await response.json();
                addLog(`✅ 从服务器读取到 ${result.data.length} 个角色卡`, 'success');
                return result.data || [];
            } catch (error) {
                addLog(`❌ 读取服务器数据失败: ${error.message}`, 'error');
                return [];
            }
        }

        // 检查状态
        async function checkStatus() {
            addLog('🔍 开始检查状态...', 'info');

            try {
                localCharacters = await getLocalCharacters();
                serverCharacters = await getServerCharacters();

                document.getElementById('localCount').textContent = `${localCharacters.length} 个`;
                document.getElementById('serverCount').textContent = `${serverCharacters.length} 个`;

                const migrateBtn = document.getElementById('migrateBtn');
                if (localCharacters.length > 0) {
                    migrateBtn.disabled = false;
                    addLog('💡 可以开始迁移', 'success');
                } else {
                    migrateBtn.disabled = true;
                    addLog('⚠️ 浏览器中没有角色卡需要迁移', 'warning');
                }
            } catch (error) {
                addLog(`❌ 检查状态失败: ${error.message}`, 'error');
            }
        }

        // 迁移单个角色
        async function migrateCharacter(character) {
            try {
                // 获取图片
                let imageData = null;
                if (character.imagePath) {
                    const blob = await getImageBlob(character.imagePath);
                    if (blob) {
                        imageData = await blobToBase64(blob);
                    }
                }

                // 上传到服务器
                const response = await fetch('/api/characters', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        id: character.id,
                        data: character.data,
                        imageData: imageData
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '上传失败');
                }

                return { success: true, name: character.data?.name || character.id };
            } catch (error) {
                return { success: false, name: character.data?.name || character.id, error: error.message };
            }
        }

        // 开始迁移
        async function startMigration() {
            const migrateBtn = document.getElementById('migrateBtn');
            migrateBtn.disabled = true;
            migrateBtn.textContent = '⏳ 迁移中...';

            addLog('🚀 开始迁移...', 'info');

            let success = 0;
            let failed = 0;

            for (const character of localCharacters) {
                const name = character.data?.name || character.id;
                addLog(`📤 正在迁移: ${name}`, 'info');

                const result = await migrateCharacter(character);

                if (result.success) {
                    addLog(`✅ 成功: ${result.name}`, 'success');
                    success++;
                } else {
                    addLog(`❌ 失败: ${result.name} - ${result.error}`, 'error');
                    failed++;
                }
            }

            addLog(`\n🎉 迁移完成！`, 'success');
            addLog(`✅ 成功: ${success} 个`, 'success');
            if (failed > 0) {
                addLog(`❌ 失败: ${failed} 个`, 'error');
            }

            migrateBtn.textContent = '✅ 迁移完成';

            // 刷新状态
            setTimeout(() => {
                checkStatus();
                migrateBtn.textContent = '⬆️ 开始迁移到服务器';
            }, 2000);
        }

        // 页面加载时自动检查
        window.onload = () => {
            checkStatus();
        };
    </script>
</body>
</html>
